[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "michal-job-finder"
version = "0.1.0"
requires-python = ">=3.11"
# Runtime dependencies live in requirements.txt only (that's what both local
# `pip install -r requirements.txt` and the Streamlit Cloud deploy use) —
# keeping a second copy here just let them drift out of sync with no benefit.

[tool.pytest.ini_options]
pythonpath = ["."]
