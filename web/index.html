<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The app bar's --surface in each theme (tokens.css); the head script below
         pins both to one theme when the user forces it. brand.spec keeps them in sync. -->
    <meta name="theme-color" content="#FFFDF9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1D1914" media="(prefers-color-scheme: dark)" />
    <script>
      // Runs before any stylesheet so a saved theme or language never flashes, and a member
      // never sees the prerendered landing. ES5 on purpose; storage access can throw (private
      // mode, blocked cookies).
      (function () {
        var root = document.documentElement
        var supported = ['en', 'pl']
        var themeColors = { light: '#FFFDF9', dark: '#1D1914' }
        var theme = null
        var lang = null
        var session = null
        try {
          theme = localStorage.getItem('joffers-theme')
          lang = localStorage.getItem('joffers-lang')
          session = localStorage.getItem('joffers-auth')
        } catch (e) {}
        // Same rules as startsInApp() in src/lib/session.ts, plus a failed link's #error: the app
        // (or the landing's expired-link notice) boots here, so the static landing stays hidden
        // behind the boot skeleton until React renders (BootSkeleton.css, App.tsx).
        if (session !== null || /(^#|&)(access_token|error|error_code|error_description)=/.test(location.hash)) {
          root.setAttribute('data-boot', 'app')
        }
        // 'light' | 'dark' forces a theme; anything else leaves it on auto (color-scheme).
        if (theme === 'light' || theme === 'dark') {
          root.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="color-scheme"]')
          if (meta) meta.setAttribute('content', theme)
          // Both media variants get the forced colour, so the browser UI matches the page.
          var bars = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < bars.length; i++) bars[i].setAttribute('content', themeColors[theme])
        }
        // Same rules as detectLang() in src/i18n/detect.ts: a saved choice, then the
        // first browser language we support, then English.
        if (supported.indexOf(lang) < 0) {
          lang = 'en'
          var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']
          for (var j = 0; j < languages.length; j++) {
            var prefix = String(languages[j]).slice(0, 2).toLowerCase()
            if (supported.indexOf(prefix) >= 0) { lang = prefix; break }
          }
        }
        root.lang = lang
      })()
    </script>
    <title>JOffers</title>
    <meta name="description" content="Every evening around 18:00 JOffers checks job boards, scores each QA offer 0–100 against your profile and shows why." />
    <!-- Safari before 26 ignores SVG favicons, so it takes the PNG (the same mark).
         The usual order: the sized PNG first, so browsers with SVG support still prefer it. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Link previews need absolute URLs: vite.config.ts swaps in the public app URL (SITE_URL). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JOffers" />
    <meta property="og:title" content="JOffers — QA jobs, scored for you." />
    <meta property="og:description" content="Every evening around 18:00 JOffers checks job boards, scores each QA offer 0–100 against your profile and shows why." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JOffers logo and the line “QA jobs, scored for you.” next to a match ring showing 92, Top match." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
