[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "michal-job-finder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "requests>=2.32", "beautifulsoup4>=4.12", "python-dateutil>=2.9", "streamlit>=1.40", "pandas>=2.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
