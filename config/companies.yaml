# Companies whose own applicant-tracking system (ATS) is read directly, mainly
# IT contractors staffing EU institutions and agencies. Adding a company needs
# no code change: put it under its ATS with the identifier its job board uses.
#
#   workable:        slug from apply.workable.com/<slug>
#   smartrecruiters: company id from jobs.smartrecruiters.com/<id>
#   talentclue:      data-client-id of the jobs widget on <company>.talentclue.com
#   greenhouse:      board token from job-boards.greenhouse.io/<slug>
#   lever:           site name from jobs.lever.co/<slug>
#   ashby:           organisation from jobs.ashbyhq.com/<slug>
#   recruitee:       subdomain from <slug>.recruitee.com
#   workday:         <host>.myworkdayjobs.com/<site>, plus the tenant from its /wday/cxs/<tenant>/ API path
#
# Companies found by `python -m job_finder.cli discover-ats` are added after you approve
# them (the Monday e-mail's links); those live in the database (ats_companies), not here.
#
# Only QA/test titles are kept; remote comes from the ATS's own remote field
# and phrases like "far site" / "remotely from Europe" in the title.
workable:
  - {name: European Dynamics, slug: european-dynamics}
  - {name: Sword Group, slug: sword-group}
  - {name: Netguru, slug: netguru}
  - {name: Monterail, slug: monterail}

smartrecruiters:
  - {name: ARHS Group, slug: ARHS}
  - {name: Sopra Steria, slug: SopraSteria1}

talentclue:
