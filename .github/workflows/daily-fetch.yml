name: Daily fetch

on:
  # The punctual trigger is external: a scheduler (cron-job.org) calls
  # workflow_dispatch with daily=true at 11:00 and 18:00 Europe/Warsaw, because
  # GitHub's own cron runs hours late or not at all on busy days. The crons below
  # stay as a fallback; in each slot the first daily run fetches, later ones skip.
  # A second cron-job.org job calls it with tier=fast every 30 minutes, 7:00–21:30 on
  # workdays: light sources only, and an e-mail only when something new turned up.
  schedule:
    # GitHub cron is UTC-only. All four fire every day; the gate step below keeps
    # the two that are 11:41 and 18:41 in Europe/Warsaw (CEST in summer, CET in winter).
    - cron: "41 9 * * *"
    - cron: "41 10 * * *"
    - cron: "41 16 * * *"
    - cron: "41 17 * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: "Scheduled run: skip if this slot's (11:00 / 18:00) fetch already happened"
        type: boolean
        default: false
      skip_sensitive:
        description: "Skip Pracuj.pl, No Fluff Jobs and CzyJestEldorado"
        type: boolean
        default: false
      tier:
        description: "full: every source (11:00 / 18:00). fast: light sources only, every 30 min on workdays"
        type: choice
        options: [full, fast]
        default: full

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Keep only the crons that are 11:41 and 18:41 in Warsaw
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          FIRED_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Compare against the cron that fired, not the clock, so a delayed
          # scheduled run still counts.
          if [ "$(TZ=Europe/Warsaw date +%z)" = "+0200" ]; then want="41 9 * * *|41 16 * * *"; else want="41 10 * * *|41 17 * * *"; fi
          if [ "$FIRED_CRON" = "${want%%|*}" ] || [ "$FIRED_CRON" = "${want##*|}" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Skip if this slot's fetch already ran
        id: due
        if: steps.gate.outputs.run == 'true'
        env:
          DAILY: ${{ github.event_name == 'schedule' || inputs.daily }}
          TIER: ${{ inputs.tier || 'full' }}
        run: |
          # A manual "Run workflow" always fetches; scheduled triggers fetch once per slot.
          # A fast run never waits for a slot: it is the in-between run.
          if [ "$DAILY" != "true" ] || [ "$TIER" = "fast" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          due=$(python -m job_finder.cli daily-due)
          echo "Daily fetch due: $due"
          if [ "$due" = "yes" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch
        if: steps.due.outputs.run == 'true'
        env:
          SKIP_SENSITIVE: ${{ inputs.skip_sensitive }}
          TIER: ${{ inputs.tier || 'full' }}
        run: |
          if [ "$SKIP_SENSITIVE" = "true" ]; then extra="--skip-sensitive"; else extra=""; fi
          extra="$extra --tier $TIER"
          # CzyJestEldorado answers 403 to every GitHub-hosted runner (Oct 2026), so it is
          # left out here; it still runs locally and from the dashboard.
          python -m job_finder.cli fetch --trigger "${{ github.event_name }}" --skip-source CzyJestEldorado $extra

      - name: Send summary
        # Still report when some sources failed — that's worth knowing too.
        if: always() && steps.due.outputs.run == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SUMMARY_TO: ${{ vars.SUMMARY_TO }}
          APP_URL: ${{ vars.APP_URL }}
          TIER: ${{ inputs.tier || 'full' }}
        run: |
          # The 11:00 / 18:00 e-mail always goes out (it also reports failed sources);
          # a fast run's only when it found new offers.
          if [ "$TIER" = "fast" ]; then extra="--only-if-new"; else extra=""; fi
          python -m job_finder.cli notify-summary --hours 24 $extra
