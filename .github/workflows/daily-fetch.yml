name: Daily fetch

on:
  # The punctual trigger is external: a scheduler (cron-job.org) calls
  # workflow_dispatch with daily=true at 17:45 Europe/Warsaw, because GitHub's
  # own cron runs hours late or not at all on busy days. The cron below stays
  # as a fallback; whichever daily run comes first fetches, later ones skip.
  schedule:
    # GitHub cron is UTC-only. Both fire every day; the gate step below keeps
    # whichever one is 17:41 in Europe/Warsaw (CEST in summer, CET in winter).
    - cron: "41 15 * * *"
    - cron: "41 16 * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: "Daily run: skip if today's evening fetch already happened"
        type: boolean
        default: false
      skip_sensitive:
        description: "Skip Pracuj.pl, No Fluff Jobs and CzyJestEldorado"
        type: boolean
        default: false

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Keep only the cron that is 17:41 in Warsaw
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          FIRED_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Compare against the cron that fired, not the clock, so a delayed
          # scheduled run still counts.
          if [ "$(TZ=Europe/Warsaw date +%z)" = "+0200" ]; then want="41 15 * * *"; else want="41 16 * * *"; fi
          if [ "$FIRED_CRON" = "$want" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Skip if today's evening fetch already ran
        id: due
        if: steps.gate.outputs.run == 'true'
        env:
          DAILY: ${{ github.event_name == 'schedule' || inputs.daily }}
        run: |
          # A manual "Run workflow" always fetches; daily triggers fetch once a day.
          if [ "$DAILY" != "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          due=$(python -m job_finder.cli daily-due)
          echo "Daily fetch due: $due"
          if [ "$due" = "yes" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch
        if: steps.due.outputs.run == 'true'
        env:
          SKIP_SENSITIVE: ${{ inputs.skip_sensitive }}
        run: |
          if [ "$SKIP_SENSITIVE" = "true" ]; then extra="--skip-sensitive"; else extra=""; fi
          # CzyJestEldorado answers 403 to every GitHub-hosted runner (Oct 2026), so it is
          # left out here; it still runs locally and from the dashboard.
          python -m job_finder.cli fetch --trigger "${{ github.event_name }}" --skip-source CzyJestEldorado $extra

      - name: Send summary
        # Still report when some sources failed — that's worth knowing too.
        if: always() && steps.due.outputs.run == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SUMMARY_TO: ${{ vars.SUMMARY_TO }}
          APP_URL: ${{ vars.APP_URL }}
        run: python -m job_finder.cli notify-summary --hours 24
