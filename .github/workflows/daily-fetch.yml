name: Daily fetch

on:
  schedule:
    # GitHub cron is UTC-only. Both fire every day; the gate step below keeps
    # whichever one is 18:00 in Europe/Warsaw (CEST in summer, CET in winter).
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      skip_sensitive:
        description: "Skip Pracuj.pl, No Fluff Jobs and CzyJestEldorado"
        type: boolean
        default: false

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Keep only the run that is 18:00 in Warsaw
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          FIRED_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Compare against the cron that fired, not the clock, so a delayed
          # scheduled run still counts.
          if [ "$(TZ=Europe/Warsaw date +%z)" = "+0200" ]; then want="0 16 * * *"; else want="0 17 * * *"; fi
          if [ "$FIRED_CRON" = "$want" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Fetch
        if: steps.gate.outputs.run == 'true'
        env:
          SKIP_SENSITIVE: ${{ inputs.skip_sensitive }}
        run: |
          if [ "$SKIP_SENSITIVE" = "true" ]; then extra="--skip-sensitive"; else extra=""; fi
          python -m job_finder.cli fetch --trigger "${{ github.event_name }}" $extra

      - name: Send summary
        # Still report when some sources failed — that's worth knowing too.
        if: always() && steps.gate.outputs.run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ vars.APP_URL }}
        run: python -m job_finder.cli notify-summary --hours 24
