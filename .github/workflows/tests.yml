name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # No DATABASE_URL here: tests run against throwaway SQLite files.
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    # Supabase is mocked at the network level, so no secrets are needed: the
    # build uses the same fake project and base path as playwright.config.ts.
    env:
      VITE_SUPABASE_URL: http://supabase.test
      VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      BASE_PATH: /Job-offers/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: node scripts/check-bundle.mjs
      - run: npx playwright install --with-deps chromium
      # Reuses the build above: the web server only runs vite preview.
      - run: npx playwright test
        env:
          PW_PREBUILT: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
